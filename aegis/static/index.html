<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>AEGIS — Spatial AI</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro', 'Segoe UI', sans-serif;
            background: #0a0a0f;
            color: #fff;
            height: 100vh;
            overflow: hidden;
            touch-action: none;
        }

        /* ── Camera View ─────────────────────────────────── */
        #camera-container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        #camera-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        #overlay-canvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        /* ── HUD (heads-up display) ──────────────────────── */
        #hud-top {
            position: absolute;
            top: 0; left: 0; right: 0;
            padding: 12px 16px;
            padding-top: max(env(safe-area-inset-top), 12px);
            background: linear-gradient(to bottom, rgba(0,0,0,0.7), transparent);
            z-index: 10;
        }

        #hud-top h1 {
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 2px;
            color: #00ff88;
        }

        #status-bar {
            display: flex;
            gap: 12px;
            margin-top: 4px;
            font-size: 11px;
            color: #888;
        }

        .status-dot {
            width: 6px; height: 6px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 4px;
        }
        .status-dot.active { background: #00ff88; }
        .status-dot.inactive { background: #ff4444; }
        .status-dot.pending { background: #ffaa00; }

        /* ── Spatial Info Panel ───────────────────────────── */
        #info-panel {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            padding: 16px;
            padding-bottom: max(env(safe-area-inset-bottom), 16px);
            background: linear-gradient(to top, rgba(0,0,0,0.85), transparent);
            z-index: 10;
        }

        #spatial-summary {
            font-size: 14px;
            line-height: 1.5;
            color: #ddd;
            max-height: 120px;
            overflow-y: auto;
        }

        /* ── Controls ────────────────────────────────────── */
        #controls {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin-top: 12px;
        }

        .ctrl-btn {
            width: 56px; height: 56px;
            border-radius: 50%;
            border: 2px solid rgba(255,255,255,0.3);
            background: rgba(255,255,255,0.1);
            color: #fff;
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .ctrl-btn:active {
            transform: scale(0.9);
            background: rgba(255,255,255,0.2);
        }

        .ctrl-btn.active {
            border-color: #00ff88;
            background: rgba(0,255,136,0.2);
            color: #00ff88;
        }

        .ctrl-btn.recording {
            border-color: #ff4444;
            background: rgba(255,68,68,0.3);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(255,68,68,0.4); }
            50% { box-shadow: 0 0 0 12px rgba(255,68,68,0); }
        }

        /* ── Start Screen ────────────────────────────────── */
        #start-screen {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #0a0a0f;
            z-index: 100;
        }

        #start-screen h1 {
            font-size: 32px;
            font-weight: 800;
            color: #00ff88;
            letter-spacing: 3px;
            margin-bottom: 8px;
        }

        #start-screen p {
            color: #888;
            font-size: 14px;
            margin-bottom: 32px;
        }

        #start-btn {
            padding: 16px 48px;
            font-size: 18px;
            font-weight: 600;
            color: #0a0a0f;
            background: #00ff88;
            border: none;
            border-radius: 32px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        #start-btn:active { transform: scale(0.95); }

        /* ── Toast Notifications ─────────────────────────── */
        #toast {
            position: absolute;
            top: 80px;
            left: 50%;
            transform: translateX(-50%);
            padding: 8px 20px;
            background: rgba(0,0,0,0.85);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 20px;
            font-size: 13px;
            color: #fff;
            z-index: 50;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            backdrop-filter: blur(10px);
        }
        #toast.show { opacity: 1; }

        .hidden { display: none !important; }
    </style>
</head>
<body>
    <!-- Start Screen -->
    <div id="start-screen">
        <h1>AEGIS</h1>
        <p>Turn Any Phone Into Your Spatial AI</p>
        <button id="start-btn">Start Camera</button>
    </div>

    <!-- Camera View -->
    <div id="camera-container" class="hidden">
        <video id="camera-video" autoplay playsinline muted></video>
        <canvas id="overlay-canvas"></canvas>

        <!-- HUD Top -->
        <div id="hud-top">
            <h1>AEGIS</h1>
            <div id="status-bar">
                <span><span class="status-dot" id="dot-camera"></span>Camera</span>
                <span><span class="status-dot" id="dot-server"></span>Server</span>
                <span><span class="status-dot" id="dot-voice"></span>Voice</span>
                <span id="fps-display">-- FPS</span>
            </div>
        </div>

        <!-- Info Panel Bottom -->
        <div id="info-panel">
            <div id="spatial-summary">Connecting to AEGIS...</div>
            <div id="controls">
                <button class="ctrl-btn" id="btn-voice" title="Voice">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/></svg>
                </button>
                <button class="ctrl-btn" id="btn-snapshot" title="Snapshot">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="13" r="4"/><path d="M5 7h2l2-3h6l2 3h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2z"/></svg>
                </button>
                <button class="ctrl-btn" id="btn-flip" title="Flip Camera">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
                </button>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div id="toast"></div>

    <script src="/static/app.js"></script>
</body>
</html>
